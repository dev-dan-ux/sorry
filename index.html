<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>I'm Sorry 💐</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Poppins:wght@300;400&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;overflow:hidden;-webkit-text-size-adjust:100%;overscroll-behavior:none;background:#050514;font-family:'Poppins',sans-serif}
  canvas{position:fixed;inset:0;width:100%;height:100%}
  #bouquets{pointer-events:none}
  .card{position:fixed;left:50%;top:max(8px,env(safe-area-inset-top));transform:translateX(-50%);width:min(720px,92vw);
    box-sizing:border-box;display:flex;flex-direction:column;z-index:5;
    padding:22px 24px;border-radius:22px;text-align:center;color:#fff;
    background:rgba(20,10,40,.55);backdrop-filter:blur(8px);
    border:1px solid rgba(255,180,220,.35);box-shadow:0 0 40px rgba(255,100,180,.35);
    animation:glow 3s ease-in-out infinite alternate}
  @keyframes glow{to{box-shadow:0 0 70px rgba(255,140,200,.6)}}
  .card h1{flex:none;font-family:'Dancing Script',cursive;font-size:clamp(30px,7vw,52px);margin:0 0 8px;line-height:1.1;
    background:linear-gradient(90deg,#ffd1e8,#ff8cc6,#ffe29a);-webkit-background-clip:text;color:transparent}
  #msg{font-weight:300;line-height:1.65;font-size:clamp(13px,3.5vw,17px);text-align:left;white-space:pre-wrap;
    overflow-y:auto;flex:1 1 auto;min-height:0;padding-right:6px;overflow-wrap:anywhere;-webkit-overflow-scrolling:touch;
    scrollbar-width:thin;scrollbar-color:#ff8cc680 transparent}
  #msg::-webkit-scrollbar{width:5px}#msg::-webkit-scrollbar-thumb{background:#ff8cc680;border-radius:4px}
  .from{flex:none;font-family:'Dancing Script',cursive;font-size:26px;margin-top:10px;min-height:32px;color:#ffc2e0;opacity:0;transition:opacity 1.5s}
  .hint{position:fixed;bottom:max(10px,env(safe-area-inset-bottom));z-index:6;width:100%;text-align:center;color:#ffffff88;font-size:12px;pointer-events:none}
  .sticker{position:fixed;bottom:-60px;pointer-events:none;user-select:none;animation:floatUp linear forwards;
    filter:drop-shadow(0 0 8px rgba(255,255,255,.5))}
  @keyframes floatUp{to{transform:translateY(-115vh) rotate(var(--rot));opacity:.0}}
  .big{position:fixed;font-size:clamp(46px,9vw,80px);animation:bob 2.4s ease-in-out infinite;
    filter:drop-shadow(0 0 14px rgba(255,150,210,.8));pointer-events:none}
  @keyframes bob{50%{transform:translateY(-14px) rotate(8deg)}}
  /* ---- floating photos ---- */
  #band{position:fixed;left:0;width:100%;overflow:hidden;z-index:4;
    -webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);
    mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
  #track{display:flex;align-items:center;width:max-content;padding:18px 0 14px;animation:slide linear infinite}
  @keyframes slide{to{transform:translateX(-50%)}}
  .paused #track,#band:hover #track{animation-play-state:paused}
  .polaroid{flex:none;margin-right:30px;background:#fff;padding:9px 9px 0;border-radius:6px;position:relative;cursor:pointer;
    transform:rotate(var(--tilt,0deg));animation:pfloat 4s ease-in-out infinite;
    box-shadow:0 8px 26px rgba(0,0,0,.5),0 0 28px rgba(255,150,210,.6)}
  @keyframes pfloat{0%,100%{transform:translateY(0) rotate(var(--tilt,0deg))}
    50%{transform:translateY(-13px) rotate(calc(var(--tilt,0deg) * -1))}}
  .polaroid .ph{height:var(--h);overflow:hidden;border-radius:2px;margin:0 auto}
  .polaroid.port .ph{width:calc(var(--h) * .75)}
  .polaroid.land .ph{width:calc(var(--h) * 1.333)}
  .polaroid img{width:100%;height:100%;object-fit:cover;object-position:center 32%;display:block}
  .polaroid span{display:block;text-align:center;font-family:'Dancing Script',cursive;font-size:20px;
    color:#b0306f;padding:5px 0 7px;white-space:nowrap}
  .polaroid .tape{position:absolute;top:-9px;left:50%;width:56px;height:18px;
    transform:translateX(-50%) rotate(-3deg);background:rgba(255,190,220,.78);border-radius:2px}
  #lightbox{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;
    flex-direction:column;background:rgba(5,5,20,.9);backdrop-filter:blur(6px);cursor:pointer}
  #lightbox.on{display:flex}
  #lightbox img{max-width:88vw;max-height:70vh;object-fit:contain;border:10px solid #fff;border-radius:6px;
    box-shadow:0 0 70px rgba(255,140,200,.75)}
  @media (max-width:700px){.big{display:none}.card{padding:16px 16px 12px;border-radius:18px}
    .polaroid{margin-right:18px;padding:6px 6px 0}.polaroid span{font-size:16px;padding:3px 0 5px}}
  @media (max-height:500px){.card{padding:10px 14px 8px}.card h1{font-size:26px;margin-bottom:4px}.from{font-size:20px;margin-top:4px}.hint{display:none}}
  #lbCap{font-family:'Dancing Script',cursive;font-size:clamp(22px,6vw,32px);color:#ffd1e8;margin-top:14px}
</style>
</head>
<body>
<canvas id="fw"></canvas>
<canvas id="bouquets"></canvas>

<div class="card">
  <h1 id="title">I'm Sorry</h1>
  <div id="msg"></div>
  <div class="from" id="from"></div>
</div>

<div class="big" style="left:4%;top:14%">🥺</div>
<div class="big" style="right:4%;top:16%;animation-delay:.6s">💖</div>
<div class="big" style="left:42%;top:1%;animation-delay:1.1s">🌹</div>
<div class="big" style="right:24%;top:2%;animation-delay:.3s">✨</div>

<div id="band"><div id="track"></div></div>
<div id="lightbox"><img id="lbImg" alt=""><div id="lbCap"></div></div>

<div class="hint">👆 Tap / click anywhere para magpaputok pa ng fireworks</div>

<script>
/* ========= EDIT MO DITO ========= */
const TO   = "Baby";               // pangalan ng pagbibigyan
const FROM = "— Dan";               // pirma mo
const TITLE = "Sorry, " + TO + " 💗";
const MESSAGE =
`Hi baby, alam kong hindi ka okay ngayon, lalo na sa kasagsagan ng review mo, at ganyan pa ang nararamdaman mo. Sorry kung yan yung nararamdaman mo ngayon.

Yes, tama ka, may kasalanan din po ako. Hindi ko naman po sinasadya na magkaganun, lalong hindi ko po gusto, kasi alam mo naman kung gaano kita kamahal, at ayokong nagkakaroon ka ng iniisip dahil sa akin.

Sorry kung ngayon nahihirapan ka dahil sa akin. Nalulungkot ako, feel ko di mo na ako mahal, or feel ko nabawasan na yung pagmamahal mo sa akin, lalo na yung sinabi mo kanina. Pero palagi mong tatandaan na mahal na mahal kita kahit anong mangyari, at wala na akong ibang gusto kundi ikaw.

Diba nangako ako sa'yo na papakasalan kita? Opo, tutuparin ko yun, lahat ng promises and plans natin.

Di ko na po hahabaan kasi baka hindi magkasya sa website na dine-develop ko ngayon. Palagi mong tatandaan na MAHAL NA MAHAL NA MAHAL KITA kahit anong mangyari, okay?

Sorry ulit baby, babawi po ako sa'yo. I LOVE YOU SO MUCH! 💗`;
// Mga picture ninyo (nasa folder na "photos"). shape: "port" = patayo, "land" = pahiga
const PHOTOS = [
  { src:"photos/p1.jpg", shape:"port", cap:"Us 💕" },
  { src:"photos/p3.jpg", shape:"land", cap:"Mahal kita" },
  { src:"photos/p2.jpg", shape:"port", cap:"Pasensya na" },
  { src:"photos/p4.jpg", shape:"land", cap:"Sorry 🥺" }
];
/* ================================ */

document.getElementById('title').textContent = TITLE;

/* ---------- typewriter ---------- */
(function(){
  const el=document.getElementById('msg'), f=document.getElementById('from'); let i=0, done=false;
  function finish(){ done=true; el.textContent=MESSAGE; f.textContent=FROM; f.style.opacity=1; }
  (function t(){ if(done) return;
    if(i<=MESSAGE.length){ el.textContent=MESSAGE.slice(0,i++); el.scrollTop=el.scrollHeight; setTimeout(t,30);}
    else finish(); })();
  document.querySelector('.card').addEventListener('dblclick',finish); // double tap = ipakita agad
})();

/* ---------- fireworks ---------- */
const fw=document.getElementById('fw'), fx=fw.getContext('2d');
const bq=document.getElementById('bouquets'), bx=bq.getContext('2d');
let W,H,DPR=Math.min(devicePixelRatio||1,2);
function resize(){W=innerWidth;H=innerHeight;
  for(const c of [fw,bq]){c.width=W*DPR;c.height=H*DPR;}
  fx.setTransform(DPR,0,0,DPR,0,0); bx.setTransform(DPR,0,0,DPR,0,0); buildBouquets(); layoutBand();}
addEventListener('resize',resize);

const rockets=[], parts=[];
const PALETTES=[
  ['#ff4d6d','#ff8fa3','#ffccd5'],['#ffd166','#ffe29a','#fff3c4'],
  ['#9b5de5','#c77dff','#e0aaff'],['#00f5d4','#9bf6ff','#caffbf'],
  ['#ff70a6','#ff9770','#ffd670'],['#ffffff','#ffd6ff','#c8b6ff']];
const rnd=(a,b)=>a+Math.random()*(b-a);

function launch(tx,ty){
  const x=tx??rnd(W*.15,W*.85), y=ty??rnd(H*.12,H*.5);
  rockets.push({x:tx??x+rnd(-60,60),y:H,tx:x,ty:y,vy:-rnd(9,13),
    pal:PALETTES[Math.floor(Math.random()*PALETTES.length)]});
}
function burst(x,y,pal){
  const type=['circle','heart','ring','willow','star'][Math.floor(Math.random()*5)];
  const n=type==='heart'?90:rnd(70,120)|0;
  for(let i=0;i<n;i++){
    let vx,vy,life=rnd(60,100),grav=.035,drag=.985;
    const a=i/n*Math.PI*2, c=pal[i%pal.length];
    if(type==='heart'){const s=.22;
      vx=s*16*Math.pow(Math.sin(a),3);
      vy=-s*(13*Math.cos(a)-5*Math.cos(2*a)-2*Math.cos(3*a)-Math.cos(4*a));}
    else if(type==='ring'){const s=4.2;vx=Math.cos(a)*s;vy=Math.sin(a)*s;}
    else if(type==='star'){const s=(i%2?2.2:4.8);vx=Math.cos(a)*s;vy=Math.sin(a)*s;}
    else if(type==='willow'){const s=rnd(1,4.5);vx=Math.cos(a)*s;vy=Math.sin(a)*s;life=rnd(110,160);grav=.05;}
    else {const s=rnd(1,5);vx=Math.cos(a)*s;vy=Math.sin(a)*s;}
    parts.push({x,y,vx,vy,life,max:life,c,grav,drag,sz:rnd(1.4,2.8)});
  }
  // petals bonus
  for(let i=0;i<14;i++) parts.push({x,y,vx:rnd(-3,3),vy:rnd(-3,1),life:140,max:140,c:'#ffb3d1',grav:.03,drag:.99,sz:3.4,petal:true});
}
function stepFireworks(){
  fx.globalCompositeOperation='source-over';
  fx.fillStyle='rgba(5,5,20,.22)'; fx.fillRect(0,0,W,H);
  fx.globalCompositeOperation='lighter';
  for(let i=rockets.length-1;i>=0;i--){const r=rockets[i];
    r.x+=(r.tx-r.x)*.03; r.y+=r.vy; r.vy*=.985;
    fx.fillStyle=r.pal[0]; fx.beginPath(); fx.arc(r.x,r.y,2.2,0,7); fx.fill();
    if(r.y<=r.ty||r.vy>-1.2){burst(r.x,r.y,r.pal);rockets.splice(i,1);}
  }
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];
    p.vx*=p.drag;p.vy=p.vy*p.drag+p.grav;p.x+=p.vx;p.y+=p.vy;p.life--;
    const al=Math.max(p.life/p.max,0);
    fx.globalAlpha=al; fx.fillStyle=p.c;
    if(p.petal){fx.beginPath();fx.ellipse(p.x,p.y,p.sz*1.6,p.sz*.8,p.life*.1,0,7);fx.fill();}
    else{fx.beginPath();fx.arc(p.x,p.y,p.sz*al+.3,0,7);fx.fill();}
    if(p.life<=0)parts.splice(i,1);
  }
  fx.globalAlpha=1;
}
addEventListener('pointerdown',e=>{launch(e.clientX,e.clientY);setTimeout(()=>launch(),150);});
setInterval(()=>{ if(rockets.length<5) launch(); },650);

/* ---------- bouquets ---------- */
const FLOWER_COLORS=[
  ['#ff4d6d','#ffd6e0'],['#ff85c0','#fff0f7'],['#ffd166','#fff3c4'],
  ['#c77dff','#f1e0ff'],['#ff9770','#ffe1d6'],['#ffffff','#ffe3f1'],['#ff5d8f','#ffc2d6']];
let bouquets=[];
function buildBouquets(){
  const count=W<420?2:W<600?3:W<1000?5:7;
  bouquets=[];
  for(let b=0;b<count;b++){
    const hs=Math.max(.5,Math.min(1,(H-380)/420)), bxPos=(b+.5)/count*W, scale=Math.min(W<600?.7:1,hs)*rnd(.85,1.15);
    const flowers=[], n=rnd(7,10)|0;
    for(let i=0;i<n;i++){
      const t=n===1?0:i/(n-1)*2-1; // -1..1
      flowers.push({a:t*.95+rnd(-.08,.08), len:rnd(120,175)*scale+(1-Math.abs(t))*30*scale,
        r:rnd(20,30)*scale, petals:[5,6,8,10,12][Math.floor(Math.random()*5)],
        col:FLOWER_COLORS[Math.floor(Math.random()*FLOWER_COLORS.length)], ph:rnd(0,6.28), rot:rnd(0,6)});
    }
    bouquets.push({x:bxPos,y:H-18,scale,flowers,ph:rnd(0,6.28),ribbon:['#ff4d6d','#c77dff','#ffd166'][b%3]});
  }
}
function drawFlower(x,y,f,t){
  const sway=Math.sin(t*1.2+f.ph)*.04;
  bx.save(); bx.translate(x,y); bx.rotate(f.rot+t*.15);
  for(let i=0;i<f.petals;i++){
    const a=i/f.petals*Math.PI*2;
    bx.save(); bx.rotate(a);
    const g=bx.createLinearGradient(0,0,0,-f.r*1.5);
    g.addColorStop(0,f.col[0]); g.addColorStop(1,f.col[1]);
    bx.fillStyle=g;
    bx.beginPath(); bx.ellipse(0,-f.r*.75,f.r*.42,f.r*.8,0,0,7); bx.fill();
    bx.restore();
  }
  bx.fillStyle='#ffcf33'; bx.beginPath(); bx.arc(0,0,f.r*.34,0,7); bx.fill();
  bx.fillStyle='#e8a600'; for(let i=0;i<6;i++){bx.beginPath();bx.arc(Math.cos(i)*f.r*.16,Math.sin(i)*f.r*.16,f.r*.05,0,7);bx.fill();}
  bx.restore();
}
function drawBouquet(b,t){
  const sw=Math.sin(t*1.1+b.ph)*.05;
  const heads=[];
  bx.lineCap='round';
  // stems + leaves
  for(const f of b.flowers){
    const a=f.a+sw+Math.sin(t*1.3+f.ph)*.03;
    const hx=b.x+Math.sin(a)*f.len, hy=b.y-Math.cos(a)*f.len;
    const cx=b.x+Math.sin(a*.4)*f.len*.3, cy=b.y-f.len*.55;
    bx.strokeStyle='#2f9e5b'; bx.lineWidth=3*b.scale;
    bx.beginPath(); bx.moveTo(b.x,b.y); bx.quadraticCurveTo(cx,cy,hx,hy); bx.stroke();
    // leaf
    const lx=(b.x+cx)/2+(hx-b.x)*.15, ly=(b.y+cy)/2;
    bx.fillStyle='#3cc47a'; bx.beginPath();
    bx.ellipse(lx+10*b.scale*Math.sign(a||1),ly,13*b.scale,5*b.scale,a*1.5+.6,0,7); bx.fill();
    heads.push({hx,hy,f});
  }
  // filler baby's breath
  for(let i=0;i<10;i++){
    const a=(i/9*2-1)*1.05+sw, L=(95+(i%3)*28)*b.scale;
    const hx=b.x+Math.sin(a)*L, hy=b.y-Math.cos(a)*L;
    bx.strokeStyle='#4cd38a'; bx.lineWidth=1.5; bx.beginPath(); bx.moveTo(b.x,b.y); bx.lineTo(hx,hy); bx.stroke();
    bx.fillStyle='#fff'; bx.globalAlpha=.9; bx.beginPath(); bx.arc(hx,hy,3.2*b.scale,0,7); bx.fill(); bx.globalAlpha=1;
  }
  heads.sort((p,q)=>p.hy-q.hy);
  for(const h of heads) drawFlower(h.hx,h.hy,h.f,t);
  // wrapper cone
  const w=46*b.scale, ht=58*b.scale;
  const g=bx.createLinearGradient(b.x-w,b.y-ht,b.x+w,b.y);
  g.addColorStop(0,'#fff4fa'); g.addColorStop(1,'#ffb8d9');
  bx.fillStyle=g; bx.beginPath();
  bx.moveTo(b.x-w,b.y-ht); bx.lineTo(b.x+w,b.y-ht); bx.lineTo(b.x+6,b.y+14); bx.lineTo(b.x-6,b.y+14); bx.closePath(); bx.fill();
  bx.strokeStyle='#ff8fc2'; bx.lineWidth=1.5; bx.stroke();
  // ribbon + bow
  bx.fillStyle=b.ribbon; bx.fillRect(b.x-w*.62,b.y-ht*.5,w*1.24,7*b.scale);
  for(const s of[-1,1]){bx.beginPath();bx.ellipse(b.x+s*12*b.scale,b.y-ht*.5-4,12*b.scale,7*b.scale,s*.5,0,7);bx.fill();}
  bx.beginPath(); bx.arc(b.x,b.y-ht*.5-2,5*b.scale,0,7); bx.fill();
}
function drawBouquets(t){
  bx.clearRect(0,0,W,H);
  for(const b of bouquets) drawBouquet(b,t);
}

/* ---------- emoji stickers ---------- */
const STICKERS=['🌸','🌹','🌷','💐','🌺','🌻','💖','💗','🥺','🙏','✨','🎆','🎇','🦋','💝','😭','🫶'];
function spawnSticker(){
  const s=document.createElement('div'); s.className='sticker';
  s.textContent=STICKERS[Math.floor(Math.random()*STICKERS.length)];
  s.style.left=rnd(2,96)+'vw'; s.style.fontSize=rnd(22,48)+'px';
  s.style.setProperty('--rot',rnd(-40,40)+'deg');
  s.style.animationDuration=rnd(6,11)+'s';
  document.body.appendChild(s); setTimeout(()=>s.remove(),12000);
}
setInterval(spawnSticker,450);

/* ---------- floating photos ---------- */
const band=document.getElementById('band'), track=document.getElementById('track');
const lb=document.getElementById('lightbox'), lbImg=document.getElementById('lbImg'), lbCap=document.getElementById('lbCap');
lb.addEventListener('click',()=>{lb.classList.remove('on');band.classList.remove('paused');});

function makePolaroid(p,idx){
  const d=document.createElement('div');
  d.className='polaroid '+(p.shape==='land'?'land':'port');
  d.style.setProperty('--tilt',((idx%2?1:-1)*rnd(2,5.5)).toFixed(1)+'deg');
  d.style.animationDuration=rnd(3.4,5.2).toFixed(2)+'s';
  d.style.animationDelay=(-rnd(0,4)).toFixed(2)+'s';
  d.innerHTML='<i class="tape"></i><div class="ph"><img alt=""></div><span></span>';
  d.querySelector('img').src=p.src;
  d.querySelector('span').textContent=p.cap;
  d.addEventListener('click',e=>{
    e.stopPropagation();
    lbImg.src=p.src; lbCap.textContent=p.cap;
    lb.classList.add('on'); band.classList.add('paused');
  });
  return d;
}
function layoutBand(){
  const card=document.querySelector('.card'), msg=document.getElementById('msg'), from=document.getElementById('from');
  // sukatin ang buong taas ng card kung kumpleto na ang text
  const prev=msg.textContent, prevFrom=from.textContent;
  card.style.maxHeight=''; msg.textContent=MESSAGE; from.textContent=FROM;
  const natural=card.offsetHeight;
  msg.textContent=prev; from.textContent=prevFrom;

  let ext=0; for(const b of bouquets) for(const f of b.flowers) ext=Math.max(ext,f.len+f.r*1.3);
  const topPad=Math.max(8,parseFloat(getComputedStyle(card).top)||8);
  const bandMin=(H<500?80:100)+(W<700?60:78);       // pinakamaliit na taas ng photo strip
  const maxCard=Math.max(150,H-topPad-(ext*.85)-18-bandMin-10);
  const cardH=Math.round(Math.min(natural,maxCard));
  card.style.maxHeight=cardH+'px';
  card.style.height=cardH+'px';

  const top=topPad+cardH+8, chrome=W<700?60:78;
  const avail=(H-18-ext*.85)-top;
  const h=Math.round(Math.max(H<500?80:100,Math.min(230,avail-chrome)));
  band.style.top=top+'px';
  band.style.setProperty('--h',h+'px');

  track.innerHTML='';
  PHOTOS.forEach((p,i)=>track.appendChild(makePolaroid(p,i)));
  const setW=track.offsetWidth;
  const per=Math.max(1,Math.ceil(W/setW)+1);
  track.innerHTML='';
  for(let k=0;k<per*2;k++) PHOTOS.forEach((p,i)=>track.appendChild(makePolaroid(p,i+k)));
  track.style.animationDuration=Math.max(18,(setW*per)/42)+'s';
}

/* ---------- loop ---------- */
resize();
for(let i=0;i<3;i++) setTimeout(()=>launch(),i*350);
(function loop(ms){
  stepFireworks(); drawBouquets(ms/1000); requestAnimationFrame(loop);
})(0);
</script>
</body>
</html>
